name: Offline check (existing runtime only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing runtime (no installation)
        run: |
          command -v node
          node --version
          command -v npm
          npm --version
          node -e "if (+process.versions.node.split('.')[0] < 18) process.exit(1)"
      - run: npm run check
      - run: npm test
      - run: npm run docs:check
