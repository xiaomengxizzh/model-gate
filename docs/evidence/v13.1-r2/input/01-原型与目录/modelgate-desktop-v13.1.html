function reliabilityPage(){let p=policy();let inherited=state.policyScope!=='global'&&!state.policies[state.policyScope]&&!state.policyDraft;return heading('稳定性策略','让网关处理断线和临时故障。默认推荐设置，必要时按应用调整。',btn('查看模拟故障测试','policy-test'))+`<div class="statusstrip"><div><small>生效范围（演示）</small>${select('policyScope',[['global','全局默认'],['codex','Codex 专属']],state.policyScope)}</div><div><small>策略来源</small><b>${inherited?'继承全局':state.policyDraft?'未保存变更':'已保存示例'}</b></div>${state.policyScope!=='global'?btn('恢复继承全局','policy-inherit','ghost'):''}</div><div class="grid g3">${[['balanced','推荐','适合日常使用，兼顾等待与稳定性'],['stable','稳定优先','长任务，允许更多有界重试与等待'],['fast','响应优先','尽早返回失败，避免长时间等待']].map(([id,n,d])=>`<button class="modecard ${p.preset===id?'active':''}" data-act="policy-preset:${id}"><span class="radio"></span><h2>${n}</h2><p>${d}</p></button>`).join('')}</div><div class="grid policygrid mt"><div class="stack">${panel(ph('失败重试','仅对允许重试的请求生效。')+policyRow('最大重试次数','不包括首次请求；实际次数由后端安全策略限制。',select('prRetries',[[0,'不重试'],[1,'1 次'],[2,'2 次'],[3,'3 次']],p.retries))+policyRow('请求超时（秒）','原型为建议值，正式版需映射真实 deadline 语义。',select('prTimeout',[[60,'60 秒'],[120,'120 秒'],[240,'240 秒'],[600,'600 秒']],p.timeout))+policyRow('退避方式','遇到暂时故障时延长等待间隔。',select('prBackoff',[['exponential','指数退避'],['fixed','固定间隔']],p.backoff))+policyRow('尊重 429 限流等待','不吞掉 Retry-After，不盲目重复请求。',tag('固定开启','good')))}${panel(ph('断线与续传','在协议支持的前提下恢复，不承诺所有流可续传。')+policyRow('自动尝试恢复','使用已有响应状态和协议能力，无法安全恢复时提示。',`<input id="prResume" type="checkbox" ${p.resume?'checked':''}>`)+policyRow('最大恢复尝试','达到上限后保留错误，等待用户处理。',select('prReconnect',[[0,'0 次'],[1,'1 次'],[2,'2 次'],[3,'3 次']],p.reconnect))+policyRow('原生上下文压缩','由 Harness 自身负责，不由 ModelGate 自建压缩。',tag('保留原生','good')))}${panel(ph('故障回退','不会自动跨越订阅与第三方身份边界。')+policyRow('允许已配置的兼容备用模型','只在明确授权、身份及协议兼容时考虑。',`<input id="prFallback" type="checkbox" ${p.fallback?'checked':''}>`)+`<div class="actions">${btn('高级路由规则','page:routing','ghost')}</div>`)}</div><div class="stack">${panel(ph('当前策略摘要','以自然语言说明行为。')+kv('重试',p.retries+' 次以内')+kv('等待上限建议',p.timeout+' 秒')+kv('断线恢复',p.resume?'最多 '+p.reconnect+' 次':'关闭')+kv('备用模型',p.fallback?'允许已授权候选':'关闭')+`<div class="actions"><button class="primary" data-act="policy-save" ${state.policyDraft?'':'disabled'}>保存模拟策略</button>${btn('放弃修改','policy-discard','ghost')}</div>`)}${panel(ph('始终生效的安全边界')+`<div class="actiontile"><div><b>不重复执行工具</b><small>工具可能产生副作用时，禁止危险重放。</small></div></div><div class="actiontile"><div><b>不静默丢失上下文</b><small>续轮缺失时明确提示，不伪造历史。</small></div></div><div class="actiontile"><div><b>不偷偷更换模型</b><small>官方与第三方隔离，禁止未经授权的替换。</small></div></div><div class="notice">设置均为产品提案，后端尚需逐项核对重试、续传、回退 API 与真实验收。</div>`)}</div></div>`}

function dispatch(act){let [a,...rest]=act.split(':'),v=rest.join(':');if(a.startsWith('pool-')){poolDispatch(a,v);return}if(a==='detect-apps'){state.detected=true;render();toast('模拟检测完成；没有访问本机文件');return}if(a==='appfilter'){state.appFilter=v;render();return}if(a==='app-info'){let x=apps.find(x=>x.id===v);modal(x.name+' 接入说明',`<p>${x.desc}</p><div class="mt">${kv('开发状态',x.tier)}${kv('本机检测','未执行真实检测')}${kv('推荐接入流程','检测 → 推荐 → 预览 → 确认 → 验证')}</div><div class="notice">${v==='codex'?'正式版复用现有 Codex 配置与回滚接口。':'需要专用适配器及独立验收；暂不开放真实写入。'}</div>`,v==='codex'?btn('进入 Codex 配置','open-codex','primary'):btn('关闭','close'));return}if(a==='open-codex'){close();show('mode');return}if(a==='generic-guide'){modal('其他应用 / API 接入',kv('示例服务地址','127.0.0.1:8787/v1')+'<p class="muted mt">如果应用支持自定义 API，请在其设置中选择相应协议。实际密钥与可用模型由正式网关提供。</p>',btn('关闭','close')+btn('高级接入管理','open-api','primary'));return}if(a==='open-api'){close();show('clients');return}if(a==='service-new'){serviceNew();return}if(a==='service-select'){let p=state.providers.find(x=>x.id===v);if(p){serviceManage(v)}else{modal('服务模板 · 规划中','<p>此模板需要实现自动发现与真实连接验证，暂不生成虚假的接入结果。</p>',btn('返回','service-new')+btn('手动添加示例','manual-provider'))}return}if(a==='manual-provider'){providerEdit();return}if(a==='service-manage'){serviceManage(v);return}if(a==='service-edit'){providerEdit(v);return}if(a==='policy-preset'){state.policyDraft={preset:v,...presets[v]};render();return}if(a==='policy-inherit'){state.policies.codex=null;state.policyDraft=null;render();toast('Codex 恢复继承全局示例策略');return}if(a==='policy-discard'){state.policyDraft=null;render();return}if(a==='policy-save'){if(!state.policyDraft)return;state.policies[state.policyScope]={...state.policyDraft};state.policyDraft=null;render();toast('模拟策略已保存，未写入真实网关');return}if(a==='policy-test'){let p=policy();modal('模拟故障测试',table(['情景','策略结果'],[tr('临时连接失败','允许安全重试，最多 '+p.retries+' 次'),tr('收到 429','遵守 Retry-After 与预算'),tr('流式中断',p.resume?'尝试协议支持的恢复，最多 '+p.reconnect+' 次':'停止并提示错误'),tr('工具调用状态不明','禁止危险重 function policyChange(e){let id=e.target.id;if(id==='advancedNav'){state.advanced=e.target.checked;navGroups();render();return}if(id==='policyScope'){if(state.policyDraft&&!confirm('切换范围将放弃尚未保存的演示策略，继续？')){e.target.value=state.policyScope;return}state.policyScope=e.target.value;state.policyDraft=null;render();return}let map={prRetries:'retries',prTimeout:'timeout',prBackoff:'backoff',prResume:'resume',prReconnect:'reconnect',prFallback:'fallback'};if(map[id]){let val=e.target.type==='checkbox'?e.target.checked:['prRetries','prTimeout','prReconnect'].includes(id)?+e.target.value:e.target.value;state.policyDraft={...policy(),preset:'custom',[map[id]]:val};render()}}

function poolSimulate(p){let q=state.poolSim;let available=p.members.filter(c=>{let m=memberModel(c);return activeMember(c)&&permittedModel(m)&&m.api.includes(q.protocol)});if(q.scenario==='stream')return '保持当前会话绑定，不重新选模型；仅按稳定性策略尝试安全续传。';if(q.scenario==='tool')return '停止自动切换：工具是否执行尚不明确，禁止重复执行。';if(!available.length)return '没有启用且协议匹配的候选。请检查连接与候选模型。';let sequence=p.strategy==='weighted'?available.flatMap(c=>Array.from({length:c.weight},()=>c)):available;let cycle=state.poolCycles[p.id]||0;let first=p.strategy==='priority'?available[0]:sequence[cycle%sequence.length];if(p.strategy!=='priority')state.poolCycles[p.id]=cycle+1;let label=c=>`${memberModel(c)?.name} / ${prov(c.provider)}`;if(q.scenario==='unavailable'){if(!p.fallback)return '首选 '+label(first)+' 不可用；池未授权备用候选，返回错误。';if(!state.policies.global.fallback)return '全局稳定性策略未授权模型回退：返回错误。请在稳定性策略中开启后再模拟。';let next=available.find(c=>memberKey(c)!==memberKey(first));return next?'模拟备用：'+label(next)+'。仍须真实能力匹配、全局策略授权与安全检查。':'无兼容备用候选，返回错误。'}return '模拟选择：'+label(first)+'。实际能力和连接状态尚未验证。'}
function poolDispatch(a,v){let p=currentPool(),i=Number(v);if(a==='pool-select'){state.selectedPool=v;state.poolSim.result=null;render();return}if(a==='pool-new'||a==='pool-edit'){poolEditor(a==='pool-edit'?p:null);return}if(a==='pool-save'){let name=$('#poolName').value.trim(),purpose=$('#poolPurpose').value.trim(),strategy=$('#poolEditStrategy').value;if(!name||state.pools.some(x=>x.name===name&&x.id!==v)){toast('请输入不重复的模型池名称');return}let old=poolById(v);if(old)Object.assign(old,{name,purpose,strategy});else{let id='pool-'+state.poolCounter++;state.pools.push({id,name,purpose,strategy,fallback:false,members:[]});state.selectedPool=id}close();render();return}if(a==='pool-bind'){poolBind(v);return}if(a==='pool-bind-confirm'){let id=$('#poolBinding').value;if(id)state.poolBindings[v]=id;else delete state.poolBindings[v];close();render();toast('规划偏好已更新');return}if(!p)return;if(a==='pool-add'){poolAdd();return}if(a==='pool-add-confirm'){let choices=$$('.pool-add-check:checked').map(x=>state.poolAddOptions[Number(x.value)]);if(!choices.length){toast('至少选择一个模型');return}for(let c of choices)if(c&&!p.members.some(x=>memberKey(x)===memberKey(c)))p.members.push(c);close()}else if(a==='pool-delete'){modal('删除模型池',`<p>删除 ${esc(p.name)}？${poolApps(p).length} 个应用的规划引用会被清除。</p>`,btn('取消','close')+btn('确认删除','pool-delete-confirm:'+p.id,'danger'));return}else if(a==='pool-delete-confirm'){state.pools=state.pools.filter(x=>x.id!==v);for(let a of Object.keys(state.poolBindings))if(state.poolBindings[a]===v)delete state.poolBindings[a];state.selectedPool=state.pools[0]?.id||'';close()}else if(a==='pool-toggle'&&p.members[i])p.members[i].enabled=!p.members[i].enabled;else if(a==='pool-remove'&&p.members[i])p.members.splice(i,1);else if((a==='pool-up'||a==='pool-down')&&p.members[i]){let j=i+(a==='pool-up'?-1:1);if(p.members[j])[p.members[i],p.members[j]]=[p.members[j],p.members[i]]}else if(a==='pool-check'){modal('候选检查（本地模拟）',table(['模型','服务','配置状态'],p.members.map(c=>tr(esc(memberModel(c)?.name||c.model),esc(prov(c.provider)),tag(...poolStatus(c)))))+'<div class="notice">仅检查示例目录和启用状态，没有网络探活或付费调用。</div>');return}else if(a==='pool-sim'){state.poolSim.result=poolSimulate(p);render();return}state.poolSim.result=null;render()}
document.addEventListener('change',e=>{let id=e.target.id,p=currentPool();if(!p)return;if(id==='poolStrategy'){p.strategy=e.target.value;state.poolCycles[p.id]=0}else if(id==='poolFallback'){p.fallback=e.target.checked}else if(id==='poolProtocol')state.poolSim.protocol=e.target.value;else if(id==='poolScenario')state.poolSim.scenario=e.target.value;else if(id.startsWith('pool-weight-')){let c=p.members[Number(id.slice(12))];if(c)c.weight=Math.max(1,Math.min(20,Math.round(Number(e.target.value)||1)))}else return;state.poolSim.result=null;render()});
