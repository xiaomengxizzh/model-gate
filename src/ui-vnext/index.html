<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="ModelGate Desktop V13.1 控制台">
  <title>ModelGate — Desktop V13.1</title>
  <link rel="stylesheet" href="/ui-vnext/styles.css">
  <script type="module" src="/ui-vnext/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <aside class="side" aria-label="主导航">
      <a class="brand" href="#/harness" aria-label="ModelGate 应用接入首页">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 22 8v8l-10 6-10-6V8zM2 8l10 6 10-6M12 14v8M7 5l10 6"/></svg>
        </span>
        <span><strong>ModelGate</strong><small>DESKTOP / V13.1</small></span>
      </a>
      <nav id="primary-nav" class="nav" aria-label="常用功能"></nav>
      <details id="advanced-nav" class="advanced">
        <summary>高级管理</summary>
        <nav id="advanced-links" aria-label="高级功能"></nav>
      </details>
      <div class="sidebottom">
        <div id="gateway-state" class="gateway-state"><span class="dot" aria-hidden="true"></span><span>正在连接</span></div>
        <small id="gateway-detail">读取本地控制面</small>
        <span class="tag" id="runtime-tag">本地生产</span>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <nav id="breadcrumb" class="breadcrumbs9" aria-label="当前位置"></nav>
        <div class="tools">
          <span class="tag" id="production-badge">本地生产 · 真实数据</span>
          <button id="refresh" class="ghost" type="button">刷新状态</button>
          <button id="theme-toggle" class="iconbtn" type="button" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
        </div>
      </header>
      <main id="main" class="content" tabindex="-1">
        <div class="loading panel" role="status"><span class="spinner" aria-hidden="true"></span>正在读取本地控制面…</div>
      </main>
    </div>
  </div>
  <div id="toasts" class="toast hidden" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">ModelGate 需要 JavaScript；现有管理 API 仍可使用。</p></noscript>
</body>
</html>
