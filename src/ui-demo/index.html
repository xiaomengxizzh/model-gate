<!doctype html>
<html lang="zh-CN" data-style="cel-dusk" data-mode="auto" data-density="comfortable" data-motion="auto" data-border="2" data-radius="4" data-shadow="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="ModelGate 简约交互演示：模式切换、用量图表与界面设置，cel-dusk 基线。">
  <title>ModelGate · 交互演示</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主内容</a>

  <header class="topbar">
    <a class="brand" href="#/mode" aria-label="ModelGate 交互演示">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-copy">
        <strong>ModelGate</strong>
        <small>交互演示 · CEL-DUSK</small>
      </span>
    </a>

    <nav class="tabs" role="tablist" aria-label="功能区">
      <a class="tab" id="tab-mode" href="#/mode" role="tab" aria-controls="view-mode" aria-selected="true" data-view="mode">模式</a>
      <a class="tab" id="tab-charts" href="#/charts" role="tab" aria-controls="view-charts" aria-selected="false" tabindex="-1" data-view="charts">图表</a>
      <a class="tab" id="tab-settings" href="#/settings" role="tab" aria-controls="view-settings" aria-selected="false" tabindex="-1" data-view="settings">设置</a>
    </nav>

    <div class="topbar-actions">
      <p class="chip" id="live-chip" data-state="loading" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="live-text">连接中</span>
      </p>
      <p class="mode-chip" id="mode-chip" hidden></p>
      <button class="btn" type="button" id="refresh">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2v4H9"/></svg>
        刷新
      </button>
      <button class="btn btn-icon" type="button" id="theme" aria-label="切换明暗主题" title="切换明暗主题">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 6.5 6.5A5.3 5.3 0 0 1 8 1.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="view" id="view-mode" role="tabpanel" aria-labelledby="tab-mode"></section>
    <section class="view" id="view-charts" role="tabpanel" aria-labelledby="tab-charts" hidden></section>
    <section class="view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
  </main>

  <footer class="foot">
    <span>只读快照 + 模式页显式确认写入 · 数据来自本机 ModelGate</span>
    <span>cel-dusk 基线 · 无第三方依赖</span>
  </footer>

  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="dialog-backdrop" id="dialog-root" hidden></div>

  <noscript>
    <div class="noscript">这份交互演示需要 JavaScript；未启用时不会显示任何指标，也不会触发模式写入。</div>
  </noscript>
</body>
</html>
